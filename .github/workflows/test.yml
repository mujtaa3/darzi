# The attack suite is the release gate: every push runs it in all three engines.
# Chrome is the runner's preinstalled Google Chrome (the Playwright config asks
# for the `chrome` channel, not bundled Chromium); WebKit and Firefox are
# Playwright's builds. Retries are 0 in the config, so a red run is a red run.
name: attack suite

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit firefox
      - run: npm test
      - name: keep the failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

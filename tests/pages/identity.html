<!doctype html>
<html><head><meta charset="utf-8"><title>identity</title></head>
<body>
<div id="slot"></div><div id="control"></div>
<script type="module">
  import { createRuntime } from "/dist/index.js";
  window.__log = [];
  const log = (s) => window.__log.push(s);

  // The jail: a widget probes what the sandbox is supposed to take away.
  // Each probe reports "blocked" (threw), or "allowed" with what came back —
  // engines deny differently (Chrome throws on cookies; Safari returns "").
  const runtime = createRuntime({
    capabilities: [{ name: "probe.report", description: "probe results",
      handler: (p) => { for (const r of p.rows) log("REPORT " + JSON.stringify(r)); log("widget-done"); } }],
  });
  runtime.render(`<script>
    var out = [];
    function probe(api, fn) {
      try { var v = fn(); out.push({ api: api, verdict: "allowed", detail: String(v === "" ? "(empty string)" : v).slice(0, 60) }); }
      catch (e) { out.push({ api: api, verdict: "blocked", detail: e.name }); }
    }
    probe("self.origin", function () { return self.origin; });
    probe("parent.document", function () { return parent.document.title; });
    probe("top.location.href", function () { return top.location.href; });
    probe("document.cookie", function () { document.cookie = "a=1"; return document.cookie; });
    probe("localStorage", function () { localStorage.setItem("x", "1"); return localStorage.getItem("x"); });
    probe("sessionStorage", function () { sessionStorage.setItem("x", "1"); return sessionStorage.getItem("x"); });
    darzi.call("probe.report", { rows: out });
  <\/script>`, document.getElementById("slot"));

  // Control: the same reads from a frame that is NOT sandboxed. It shares our
  // origin, so it can read everything — proving the reads themselves work and
  // only the sandbox stands between the widget and them.
  window.addEventListener("message", (e) => { if (e.data && e.data.control) log("CONTROL " + e.data.control); });
  const control = document.createElement("iframe");
  control.srcdoc = `<script>
    document.cookie = "ctl=1";
    parent.postMessage({ control: "parent.document=" + parent.document.title }, "*");
    parent.postMessage({ control: "cookie=" + document.cookie }, "*");
  <\/script>`;
  document.getElementById("control").appendChild(control);
</script>
</body></html>

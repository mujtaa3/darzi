<!doctype html>
<html><head><meta charset="utf-8"><title>messages</title></head>
<body>
<div id="slot"></div>
<script type="module">
  import { createRuntime } from "/dist/index.js";
  window.__log = [];
  const log = (s) => window.__log.push(s);

  window.addEventListener("message", (e) => { if (e.data && e.data.flooded) log("FLOODED " + JSON.stringify(e.data.flooded)); });

  const runtime = createRuntime({
    capabilities: [{
      name: "probe.echo", description: "reports what params looked like on arrival",
      handler: (p) => {
        const own = p && typeof p === "object" ? Object.getOwnPropertyNames(p).sort().join(",") : typeof p;
        // Three ways a prototype key could do harm: as an own key the handler
        // trips over, as a rewritten prototype on the params object itself, or
        // as pollution of Object.prototype for the whole page.
        if (p && p.tag === "junk-replies") log("JUNK-REPLIES " + JSON.stringify(p));
        log(`REPORT ${JSON.stringify({ tag: p && p.tag, own,
          protoIntact: Object.getPrototypeOf(p) === Object.prototype && p.polluted === undefined,
          polluted: ({}).polluted !== undefined })}`);
        return true;
      },
    }],
    onAudit: (e) => log(`AUDIT ${e.method} ${e.decision}${e.reason ? " · " + e.reason : ""}`),
  });

  // A second widget sends messages that are not requests. Each one gets an audit
  // line. Only a message with a readable id gets a reply. The widget records the
  // replies on its raw port, apart from the stub's own, which have number ids.
  runtime.render(`<script>
    var raw = null, replies = [];
    window.addEventListener("message", function (e) {
      if (!e.ports || !e.ports[0]) return;
      raw = e.ports[0];
      raw.addEventListener("message", function (m) {
        if (typeof m.data.id === "number") return;
        replies.push(m.data.error ? { id: m.data.id, code: m.data.error.code, message: m.data.error.message } : { id: m.data.id, ok: true });
      });
    });
    darzi.call("probe.echo", { tag: "junk-control" }).then(function () {
      [42, "hello", null, [], { jsonrpc: "1.0", id: "old-version", method: "probe.echo" }, { jsonrpc: "2.0", id: {}, method: "probe.echo" },
       { jsonrpc: "2.0", id: true, method: "probe.echo" }, { jsonrpc: "2.0", method: 5 },
       { jsonrpc: "2.0", id: "x".repeat(301), method: "probe.echo", params: { tag: "id-too-long" } },
       { jsonrpc: "2.0", id: "method-number", method: 5 }, { jsonrpc: "2.0", id: "method-missing" },
       { jsonrpc: "2.0", id: "method-object", method: { name: "x" } },
       { jsonrpc: "2.0", id: "x".repeat(300), method: "probe.echo", params: { tag: "id-at-limit" } }
      ].forEach(function (junk) { raw.postMessage(junk); });
      // The same mistake through the stub. The promise must reject now, and not at the backstop.
      return darzi.call({ name: "x" }).then(function () { return "it resolved"; }, function (e) { return e.message; });
    }).then(function (callError) {
      return darzi.call("probe.echo", { tag: "junk-after" }).then(function () {
        return darzi.call("probe.echo", { tag: "junk-replies", replies: replies, callError: callError });
      });
    });
  <\/script>`, document.getElementById("slot"));
  // The first widget's calls come after this one's, because a rate limit is per widget.

  // The widget speaks on the raw port so it can send exactly the bytes it
  // wants. Each message probes one boundary check; the flood comes last
  // because it poisons the window for everything after it.
  runtime.render(`<script>
    var raw = null;
    window.addEventListener("message", function (e) { if (e.ports && e.ports[0]) raw = e.ports[0]; });
    darzi.call("probe.echo", { tag: "control" }).then(function () {
      var send = function (id, params) { raw.postMessage({ jsonrpc: "2.0", id: id, method: "probe.echo", params: params }); };
      send(1, JSON.parse('{"tag":"proto","__proto__":{"polluted":true}}'));
      send(2, { tag: "big", blob: "x".repeat(1100000) });
      var deep = {}; for (var i = 0; i < 40; i++) deep = { a: deep };
      send(3, { tag: "deep", deep: deep });
      send(4, { tag: "wide", wide: new Array(10001).fill(0) });
      for (var n = 0; n < 200; n++) send(100 + n, { tag: "flood" });

      // The widget is now over its limit, so it reports past the channel.
      var seen = [];
      raw.addEventListener("message", function (m) {
        if (typeof m.data.id !== "string") return;
        seen.push({ id: m.data.id, code: m.data.error && m.data.error.code });
        if (m.data.id === "flooded-last") top.postMessage({ flooded: seen }, "*");
      });
      raw.postMessage({ jsonrpc: "2.0", id: "flooded-method-number", method: 5 });
      raw.postMessage({ jsonrpc: "2.0", method: 5 });
      raw.postMessage({ jsonrpc: "2.0", id: "x".repeat(301), method: "probe.echo" });
      raw.postMessage({ jsonrpc: "2.0", id: "flooded-last", method: "probe.echo" });
    });
  <\/script>`, document.getElementById("slot"));
</script>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><title>state</title></head>
<body>
<div id="slot"></div>
<script type="module">
  import { createRuntime, memoryStore } from "/dist/index.js";
  window.__log = [];
  const log = (s) => window.__log.push(s);
  const waiters = {};
  const waitFor = (tag) => new Promise((r) => (waiters[tag] = r));

  const runtime = createRuntime({
    capabilities: [{ name: "probe.report", description: "checkpoint",
      handler: (p) => { log("REPORT " + JSON.stringify(p)); waiters[p.tag]?.(p); return true; } }],
    store: memoryStore(),
    onAudit: (e) => log(`AUDIT ${e.method} ${e.decision}${e.reason ? " · " + e.reason : ""}`),
  });
  const slot = document.getElementById("slot");
  const run = (body, id) => runtime.render(`<script>(async () => {${body}})();<\/script>`, slot, { id });

  // Save under A, with an OWN __proto__ key (from JSON.parse, since an object
  // literal would set the prototype instead of creating a key).
  let w = run(`
    await marzi.saveState(JSON.parse('{"n":42,"__proto__":{"polluted":true}}'));
    await marzi.call("probe.report", { tag: "saved" });`, "wid-A");
  await waitFor("saved"); w.destroy();

  // A fresh render under the SAME id gets it back, clean.
  w = run(`
    var s = await marzi.loadState();
    await marzi.call("probe.report", { tag: "load-A", n: s.n,
      protoKey: Object.prototype.hasOwnProperty.call(s, "__proto__"), polluted: ({}).polluted !== undefined });`, "wid-A");
  await waitFor("load-A"); w.destroy();

  // A different id sees nothing.
  w = run(`var s = await marzi.loadState(); await marzi.call("probe.report", { tag: "load-B", value: s });`, "wid-B");
  await waitFor("load-B"); w.destroy();

  // Oversize and cyclic are refused, and the widget hears why.
  w = run(`
    try { await marzi.saveState({ big: "x".repeat(100000) }); } catch (e) { await marzi.call("probe.report", { tag: "big", err: e.message }); }
    try { var a = {}; a.self = a; await marzi.saveState(a); } catch (e) { await marzi.call("probe.report", { tag: "cycle", err: e.message }); }`, "wid-C");
  await waitFor("cycle"); w.destroy();
  log("DONE");
</script>
</body></html>

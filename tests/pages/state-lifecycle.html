<!doctype html>
<html><head><meta charset="utf-8"><title>state lifecycle</title></head>
<body>
<div id="slot"></div>
<script type="module">
  import { createRuntime, memoryStore } from "/dist/index.js";
  window.__log = [];
  const log = (s) => window.__log.push(s);

  const report = { name: "probe.report", description: "checkpoint",
    handler: (p) => { log("REPORT " + JSON.stringify(p)); return true; } };
  const onAudit = (e) => log(`AUDIT ${e.widgetId} ${e.method} ${e.decision}${e.reason ? " · " + e.reason : ""}`);
  const slot = document.getElementById("slot");

  // A store whose calls never settle. It logs whether it was handed a signal
  // and when that signal aborts — the test's view of "did the runtime tell
  // the store to stop?". `started[key]` lets the page wait for a call to begin.
  const started = {};
  function hangingStore(tag) {
    const watch = (op, signal) => {
      log(`STORE ${tag} ${op} started signal=${signal ? "yes" : "no"}`);
      started[tag + op]?.();
      signal?.addEventListener("abort", () => {
        const r = signal.reason;
        log(`STORE ${tag} ${op} aborted ${r && r.name}:${r && r.message}`);
      }, { once: true });
      return new Promise(() => {});
    };
    return { getState: (id, signal) => watch("get", signal), putState: (id, json, signal) => watch("put", signal) };
  }

  // The widget times one state call and reports how it settled.
  const timed = (tag, expr) => `<script>
    var t0 = performance.now();
    ${expr}.then(
      function (v) { darzi.call("probe.report", { tag: "${tag}", ok: true, value: v, ms: Math.round(performance.now() - t0) }); },
      function (e) { darzi.call("probe.report", { tag: "${tag}", ok: false, error: e.message, ms: Math.round(performance.now() - t0) }); });
  <\/script>`;

  // 1. Deadline: a store that never answers is cut off at callTimeoutMs.
  const deadline = createRuntime({ capabilities: [report], store: hangingStore("deadline"), callTimeoutMs: 400, onAudit });
  deadline.render(timed("deadline-save", "darzi.saveState({ n: 1 })"), slot, { id: "wid-save" });
  deadline.render(timed("deadline-load", "darzi.loadState()"), slot, { id: "wid-load" });

  // 2. Destroy mid-write: the write's signal aborts the moment the widget goes.
  const teardown = createRuntime({ capabilities: [report], store: hangingStore("destroy"), onAudit });
  const putStarted = new Promise((resolve) => { started["destroyput"] = resolve; });
  const doomed = teardown.render(`<script>darzi.saveState({ n: 2 });<\/script>`, slot, { id: "wid-doomed" });
  await putStarted;
  doomed.destroy();
  log("DESTROYED wid-doomed");

  // 3. Control: a healthy store still round-trips.
  const healthy = createRuntime({ capabilities: [report], store: memoryStore(), onAudit });
  healthy.render(timed("healthy", "darzi.saveState({ n: 7 }).then(function () { return darzi.loadState(); })"), slot, { id: "wid-ok" });
</script>
</body></html>

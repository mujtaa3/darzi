<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ledger — transactions</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main>
  <div class="toolbar">
    <label for="month">Month</label> <select id="month"></select>
    <label for="category">Category</label> <select id="category"></select>
    <label for="account">Account</label> <select id="account"></select>
    <span class="sub" id="count"></span>
  </div>

  <div class="panel">
    <table>
      <thead><tr>
        <th>Date</th><th>Merchant</th><th>Category</th><th>Account</th>
        <th style="text-align:right">Amount</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <h2>Budgets</h2>
  <p class="sub">Click a category's tag above to recategorize a transaction;
  click a merchant to attach a note. Budgets here feed the dashboard bars.</p>
  <div class="panel">
    <div class="toolbar" style="margin:0 0 .6rem">
      <input id="bcat" type="text" placeholder="Category, e.g. Groceries" style="width:14rem">
      <input id="bamt" type="number" placeholder="Monthly amount" style="width:9rem" min="0" step="10">
      <button id="bset">Set budget</button>
    </div>
    <div id="budgets" class="sub"></div>
  </div>
</main>

<script type="module">
  import { nav, api, money, esc, currentMonth, monthPicker } from "./shared.js";
  nav("transactions");

  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const { month, months } = await currentMonth();
  monthPicker($("month"), months, month);

  // The category/account filters navigate through the URL too, like the month.
  const setParam = (key, value) => {
    const u = new URL(location.href);
    value ? u.searchParams.set(key, value) : u.searchParams.delete(key);
    location.href = u;
  };

  const query = new URLSearchParams({ month });
  const catFilter = params.get("category") ?? "";
  const acctFilter = params.get("account") ?? "";
  if (catFilter) query.set("category", catFilter);
  if (acctFilter) query.set("account", acctFilter);

  // The unfiltered month is fetched once so the filter dropdowns list every
  // category/account present that month, not only those matching the filter.
  const [rows, monthRows] = await Promise.all([
    api(`/api/transactions?${query}`),
    api(`/api/transactions?month=${month}`),
  ]);

  const fill = (el, values, selected) => {
    el.innerHTML = `<option value="">all</option>` +
      values.map((v) => `<option ${v === selected ? "selected" : ""}>${esc(v)}</option>`).join("");
  };
  fill($("category"), [...new Set(monthRows.map((t) => t.category))].sort(), catFilter);
  fill($("account"), [...new Set(monthRows.map((t) => t.account))].sort(), acctFilter);
  $("category").onchange = (e) => setParam("category", e.target.value);
  $("account").onchange = (e) => setParam("account", e.target.value);
  $("count").textContent = `${rows.length} transactions`;

  function rowHtml(t) {
    return `<tr data-id="${t.id}">
      <td>${esc(t.date)}</td>
      <td><span class="editable" data-edit="note">${esc(t.merchant)}</span>
          ${t.note ? `<span class="note">${esc(t.note)}</span>` : ""}</td>
      <td><span class="tag editable" data-edit="category">${esc(t.category)}</span></td>
      <td>${esc(t.account)}</td>
      <td class="amt ${t.amount >= 0 ? "pos" : ""}">${money(t.amount)}</td>
    </tr>`;
  }
  $("rows").innerHTML = rows.map(rowHtml).join("");

  // Inline editing. One delegated listener; the clicked cell becomes an input,
  // Enter saves through the same endpoints the widgets use, Escape cancels.
  $("rows").addEventListener("click", (e) => {
    const target = e.target.closest("[data-edit]");
    if (!target || target.querySelector("input")) return;
    const id = Number(target.closest("tr").dataset.id);
    const kind = target.dataset.edit;
    const t = rows.find((r) => r.id === id);

    const input = document.createElement("input");
    input.type = "text";
    input.value = kind === "category" ? t.category : t.note;
    input.placeholder = kind === "note" ? "note… (empty to clear)" : "";
    input.style.width = "11rem";
    const original = target.textContent;
    target.textContent = "";
    target.appendChild(input);
    input.focus();
    input.select();

    input.onkeydown = async (ev) => {
      if (ev.key === "Escape") { target.textContent = original; return; }
      if (ev.key !== "Enter") return;
      try {
        const updated = kind === "category"
          ? await api("/api/transactions/categorize", { id, category: input.value })
          : await api("/api/transactions/note", { id, text: input.value });
        Object.assign(t, updated);
        target.closest("tr").outerHTML = rowHtml(t);
      } catch (err) {
        alert(err.message);
        target.textContent = original;
      }
    };
    input.onblur = () => { if (target.contains(input)) target.textContent = original; };
  });

  async function showBudgets() {
    const budgets = await api(`/api/budgets?month=${month}`);
    $("budgets").innerHTML = budgets.length === 0 ? "No budgets set yet." : budgets
      .map((b) => `<span class="tag" style="margin-right:.5rem">${esc(b.category)}
        &nbsp;${money(b.spent)} / ${money(b.budget)}</span>`)
      .join("");
  }
  await showBudgets();

  $("bset").onclick = async () => {
    try {
      await api("/api/budgets", { category: $("bcat").value, amount: Number($("bamt").value) });
      $("bcat").value = ""; $("bamt").value = "";
      await showBudgets();
    } catch (err) {
      alert(err.message);
    }
  };
</script>
</body>
</html>

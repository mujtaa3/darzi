<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ledger — dashboard</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main>
  <div class="toolbar">
    <label for="month">Month</label>
    <select id="month"></select>
  </div>

  <div class="cards" id="cards"></div>

  <h2>Spending by category</h2>
  <p class="sub">The dark line on a bar is that category's budget. Set budgets on
  the Transactions page — or ask a widget to.</p>
  <div class="panel" id="categories">Loading…</div>

  <h2>Accounts</h2>
  <div class="cards" id="accounts"></div>
</main>

<script type="module">
  import { nav, api, money, esc, currentMonth, monthPicker } from "./shared.js";
  nav("index");

  const $ = (id) => document.getElementById(id);
  const { month, months } = await currentMonth();
  monthPicker($("month"), months, month);

  // Independent data, fetched together.
  const [sum, budgets, accounts] = await Promise.all([
    api(`/api/summary?month=${month}`),
    api(`/api/budgets?month=${month}`),
    api("/api/accounts"),
  ]);

  const card = (label, value, cls = "", hint = "") =>
    `<div class="card"><div class="label">${esc(label)}</div>` +
    `<div class="value ${cls}">${esc(value)}</div>` +
    (hint ? `<div class="hint">${esc(hint)}</div>` : "") + `</div>`;

  $("cards").innerHTML =
    card("Income", money(sum.income), "pos") +
    card("Spending", money(sum.spend)) +
    card("Net", money(sum.net), sum.net >= 0 ? "pos" : "neg");

  // Category bars, budget marks where one is set. Scale everything to the
  // largest of (biggest spend, biggest budget) so bars and marks share an axis.
  const budgetBy = Object.fromEntries(budgets.map((b) => [b.category, b.budget]));
  const cats = Object.entries(sum.byCategory).sort((a, b) => b[1] - a[1]);
  const axis = Math.max(...cats.map(([, v]) => v), ...Object.values(budgetBy), 1);

  $("categories").innerHTML = cats.length === 0 ? "No spending this month." : cats
    .map(([name, spent]) => {
      const budget = budgetBy[name];
      const over = budget !== undefined && spent > budget;
      const mark = budget !== undefined
        ? `<div class="mark" style="left:${(budget / axis) * 100}%"></div>` : "";
      const label = budget !== undefined
        ? `${money(spent)} / ${money(budget)}` : money(spent);
      return `<div class="catrow">
        <div class="name">${esc(name)}</div>
        <div class="track"><div class="fill ${over ? "over" : ""}"
             style="width:${(spent / axis) * 100}%"></div>${mark}</div>
        <div class="amt">${esc(label)}</div>
      </div>`;
    }).join("");

  $("accounts").innerHTML = accounts
    .map((a) => card(a.name, money(a.balance), a.balance >= 0 ? "" : "neg",
                     a.kind === "card" ? "unpaid balance" : ""))
    .join("");
</script>
</body>
</html>
